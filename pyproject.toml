[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-training-lab"
version = "0.1.1"
description = "Private Garmin evidence, nine Codex analysts, and a reviewed running plan."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "garminconnect @ git+https://github.com/cyberjunky/python-garminconnect.git@c3c1c0d66579696e3843cba20f985c66069140b9",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
gtl = "garmin_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_training"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
